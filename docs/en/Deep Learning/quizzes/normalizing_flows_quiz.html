<body>

<div id="header">Machine Learning — Normalizing Flow Models Quiz</div>

<div id="quiz-frame">

<div id="footer">Click ▶ to start · Tab between fields · Enter to submit</div>

<script>
/* ───────────────────────────────────────────────────────────────
   Quiz configuration — based on "Normalizing flow models" (slides 72–105)
   11 groups · 30 questions · easy → hard
   ─────────────────────────────────────────────────────────────── */

var VIDEO_ID = '';
var BACKGROUND = {
  enabled : true,
  color   : '#ffffff',
  autoPlay: false
};

var DEFAULT_TIME_GAP   = 4;
var POST_QUIZ_DURATION = 10;

var MOODLE = { enabled: false };

/* ───────────────────────────────────────────────────────────────
   Helpers
   ─────────────────────────────────────────────────────────────── */
var BUBBLE_DEFAULTS = {
  style       : 'bubble',
  tail        : 'left',
  bg          : 'rgba(255,248,200,0.97)',
  borderColor : '#d4a017',
  color       : '#3a2e00',
  fs          : 11,
  padding     : 7,
  borderRadius: 10,
  lineSpacing : 1.4
};

/* Explanation bubble on the right side, at the level (y) of its question. */
function mkBubble(text, y, opts) {
  var b = { x: 69, y: y, w: 30, text: text };
  for (var k in BUBBLE_DEFAULTS) b[k] = BUBBLE_DEFAULTS[k];
  if (opts) for (var k2 in opts) b[k2] = opts[k2];
  return b;
}

/* Left-aligned, wrapping question label (for match / numeric questions).
   The interactive part is placed directly under it (no gap). */
function lbl(x, y, html, wpx, fs) {
  return {
    type: 'label', x: x, y: y, fs: fs || 12,
    text: '<div style="text-align:left;white-space:normal;width:' + (wpx || 540) +
          'px;line-height:1.35">' + html + '</div>'
  };
}

/* Numeric text-input answer (checked with tolerance). */
function num(x, y, ans, tol) {
  return { x: x, y: y, w: 95, ans: ans, tol: tol, fs: 14 };
}

/* Cloze dropdown blank */
function sel(ans, options, w) {
  return { blank: true, type: 'select', ans: ans, options: options, w: w || 120 };
}

/* ───────────────────────────────────────────────────────────────
   Figures (re-drawn from the slides as SVG)
   ─────────────────────────────────────────────────────────────── */

  'style="display:block;margin-top:3px;font-family:sans-serif;font-size:10px">' +
  '<line x1="28" y1="66" x2="150" y2="66" stroke="#333"/>' +
  '<line x1="28" y1="8" x2="28" y2="66" stroke="#333"/>' +
  '<rect x="28" y="36" width="56" height="30" fill="#bfdbfe" stroke="#1d4ed8"/>' +

  '<text x="25" y="79">0</text><text x="53" y="79">1</text><text x="81" y="79">2</text>' +
  '<text x="153" y="70">z</text><text x="34" y="14">p(z)</text>' +
  '<line x1="172" y1="42" x2="226" y2="42" stroke="#2563eb" stroke-width="2"/>' +
  '<polygon points="226,37 236,42 226,47" fill="#2563eb"/>' +
  '<text x="180" y="34" font-size="11">x = 4z</text>' +
  '<line x1="262" y1="66" x2="420" y2="66" stroke="#333"/>' +
  '<line x1="262" y1="8" x2="262" y2="66" stroke="#333"/>' +
  '<rect x="262" y="52" width="144" height="14" fill="#fde68a" stroke="#b45309"/>' +
  '<text x="250" y="57" font-size="12" font-weight="bold">?</text>' +
  '<text x="259" y="79">0</text><text x="331" y="79">4</text><text x="403" y="79">8</text>' +
  '<text x="422" y="70">x</text><text x="268" y="14">p(x)</text>' +

/* Slides 82–84 — block structure of a coupling-layer Jacobian */
var JAC_SVG =
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">' +
  '<rect width="300" height="200" fill="#1e293b"/>' +
  '<text x="40" y="25" fill="#fbbf24" font-family="sans-serif" font-size="13" text-anchor="middle">J=∂x/∂z</text>' +
  '<text x="135" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">z[1:d]</text>' +
  '<text x="245" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">z[d+1:n]</text>' +
  '<text x="40" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">x[1:d]</text>' +
  '<text x="40" y="164" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">x[d+1:n]</text>' +
  '<rect x="84" y="40" width="102" height="74" rx="4" fill="#334155" stroke="#94a3b8"/>' +
  '<rect x="194" y="40" width="102" height="74" rx="4" fill="#334155" stroke="#94a3b8"/>' +
  '<rect x="84" y="122" width="102" height="74" rx="4" fill="#334155" stroke="#94a3b8"/>' +
  '<rect x="194" y="122" width="102" height="74" rx="4" fill="#334155" stroke="#94a3b8"/>' +
  '<text x="135" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="30" text-anchor="middle">A</text>' +
  '<text x="245" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="30" text-anchor="middle">B</text>' +
  '<text x="135" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="30" text-anchor="middle">C</text>' +
  '<text x="245" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="30" text-anchor="middle">D</text>' +

var JAC_SRC = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(JAC_SVG);

/* ───────────────────────────────────────────────────────────────
   GROUPS
   ─────────────────────────────────────────────────────────────── */
var GROUPS = [

  /* ════════════════════════════════════════════════════════════

          '$x$ and $z$ must have the same dimension, so there is no compression',

          '; flow: $x=f_\\theta(z)$ is ',
          sel('deterministic', ['stochastic', 'deterministic'], 95),
          '.<br>$p_\\theta(x)$ in a VAE requires ',
          sel('integrating over all z', ['integrating over all z', 'a single inverse pass', 'an adversarial discriminator'], 165),

    bubbles: [

      mkBubble('<b>Q3 — stochastic / deterministic; integrating over all z / a single inverse pass.</b><br>' +

    bubbles: [
      mkBubble('<b>Q1 — $p_X(4)=1/8=0.125$.</b><br>' +
        '$h(x)=x/4$, $|h^{\\prime}(x)|=1/4$, so $p_X(4)=p_Z(1)\\cdot\\tfrac14=\\tfrac12\\cdot\\tfrac14$. Check: $X\\sim\\mathcal{U}[0,8]$, whose height is $1/8$.', 10),
      mkBubble('<b>Q2 — the $|h^{\\prime}(x)|$ factor is missing.</b><br>' +
        'Only substituting $z=x/4$ inside $p_Z$ gives height 1/2 over a support of length 8: total mass 4. The Jacobian factor re-normalizes the stretched space.', 38),
      mkBubble('<b>Q3 — 0.625.</b><br>' +
        '$h(x)=\\sqrt{x}$, $h^{\\prime}(x)=\\frac{1}{2\\sqrt{x}}=\\frac{1}{1.6}$. Since $p_Z(0.8)=1$, $p_X(0.64)=0.625$. The naive answer 1 forgets the derivative.', 66)
    ]
  },

  /* ════════════════════════════════════════════════════════════
     GROUP 3 — Change of variables: new cases   (medium → hard)
     ════════════════════════════════════════════════════════════ */
  {
    label: 'Change of variables — new cases', maxTries: 3,
    questions: [
      { type: 'cloze', x: 4, y: 10, w: 64, fs: 13, lineSpacing: 1.9,
        parts: [
          '<b>Q1.</b> $Z\\sim\\mathcal{U}(0,1)$ and $X=-\\ln Z$ (a decreasing map). For $x>0$, $p_X(x)=$ ',
          sel('$e^{-x}$', ['$e^{-x}$', '$e^{x}$', '$1/x$', '$-\\ln x$'], 75),

          sel('Exponential(1)', ['Uniform(0,1)', 'Exponential(1)', 'Gaussian N(0,1)', 'Laplace(0,1)'], 140),
          ' distribution.'
        ] },

      { type: 'slider', x: 4, y: 27, w: 60, fs: 12,
        question: '<b>Q2.</b> Slide 75: $Z\\sim\\mathcal{U}[0,2]$ and $X=e^{Z}$ give $p_X(x)=\\frac{1}{2x}$ on $[1,e^2]$. What is $P(X\\le e)$?',
        min: 0, max: 1, step: 0.01, ans: 0.5, tol: 0.01, unit: '' },

      lbl(4, 51, '<b>Q3.</b> Affine flow $x=Az+b$ with $A=\\begin{pmatrix}2&1\\\\0&3\\end{pmatrix}$, $b=(1,-1)$, $z\\sim\\mathcal{N}(0,I_2)$.<br>' +
        'Compute $\\log p_X(x)$ at $x=(4,2)$ (natural log, 2 decimals):', 560),
      num(5, 64.5, -4.63, 0.02)
    ],
    bubbles: [
      mkBubble('<b>Q1 — $e^{-x}$, i.e. Exponential(1).</b><br>' +
        '$h(x)=e^{-x}$, so $|h^{\\prime}(x)|=e^{-x}$ and $p_Z=1$ on $(0,1)$. The derivative is negative here, which is why the formula takes the absolute value.', 10),
      mkBubble('<b>Q2 — 0.5.</b><br>' +
        '$\\int_1^e\\frac{dx}{2x}=\\frac12\\ln e=\\frac12$. Faster: $P(X\\le e)=P(Z\\le1)=\\frac12$. A bijection preserves probabilities of events; only densities pick up the Jacobian factor.', 29),
      mkBubble('<b>Q3 — $\\approx-4.63$.</b><br>' +
        'Solve $Az=x-b=(3,3)$: $z=(1,1)$. $\\log\\mathcal{N}(z;0,I)=-\\ln 2\\pi-1=-2.838$. $\\det A=6$, so subtract $\\ln6=1.792$: $-4.630$.', 53)
    ]
  },

  /* ════════════════════════════════════════════════════════════
     GROUP 4 — Multivariate change of variables & Jacobians
     ════════════════════════════════════════════════════════════ */
  {
    label: 'Change of variables (general case)', maxTries: 3,
    questions: [
      { type: 'radio', x: 4, y: 10, w: 63, fs: 12,
        question: '<b>Q1.</b> For an invertible flow $x=f(z)$ in $\\mathbb{R}^n$, which expression is correct (slide 76)?',
        choices: [
          '$p_X(x)=p_Z(f(x))\\,\\left|\\det \\frac{\\partial f}{\\partial z}\\right|$',
          '$p_X(x)=p_Z(f^{-1}(x))\\left|\\det\\frac{\\partial f^{-1}(x)}{\\partial x}\\right|=p_Z(z)\\left|\\det\\frac{\\partial f(z)}{\\partial z}\\right|^{-1}$',
          '$p_X(x)=p_Z(f^{-1}(x))$ — the density is preserved',
          '$p_X(x)=p_Z(z)\\,\\det\\frac{\\partial f(z)}{\\partial z}$'
        ],
        ans: 1 },

      lbl(4, 50, '<b>Q2.</b> Match each Jacobian fact (forward map $x=f(z)$) to its meaning:', 560),
      { type: 'match', x: 4, y: 56, w: 540, fs: 11,
        dotSize: 12, dotGap: 6, colGap: 40,
        left:  ['$\\det J = 1$',
                '$|\\det J| > 1$ at a point',
                '$\\det(A^{-1})$',
                'Jacobian of $f_2\\circ f_1$'],
        right: ['$\\det(A)^{-1}$',
                'Product of dets (log-dets add)',
                'Volume preserving: $p_X(x)=p_Z(z)$',
                'Volume expands, so density decreases'],
        ans: [2, 3, 0, 1] }
    ],
    bubbles: [
      mkBubble('<b>Q1 — the second option.</b><br>' +
        'Conservation of mass $p(x)dx=p(z)dz$ in $n$-D: the volume factor is $|\\det J|$. $\\det(A^{-1})=\\det(A)^{-1}$ switches between inverse and forward Jacobians; the absolute value handles orientation flips.', 10),
      mkBubble('<b>Q2.</b> det = 1 → volume preserving (NICE), $p_X=p_Z$. $|\\det J|>1$ → $f$ stretches space, diluting density. $\\det(A^{-1})=\\det(A)^{-1}$. Composition → product of determinants, so log-dets add over layers.', 50)
    ]
  },

  /* ════════════════════════════════════════════════════════════

    questions: [

        parts: [

          ').'

      { type: 'checkbox', x: 4, y: 33, w: 63, fs: 11,
        question: '<b>Q2.</b> Slide 79 shows a Gaussian and a uniform warped by M = 1, 2, 10 planar flows. Select ALL true statements:',
        choices: [
          'The M = 10 panels show simple invertible layers composing into complex, multi-modal densities',
          'A composition of invertible maps is itself invertible',
          '$\\log p_X=\\log p_Z(z_0)-\\sum_m\\log|\\det J_{f_m}|$, i.e. log-dets add',
          'Each layer must be volume preserving for the cascade to be valid'
        ],
        ans: [0, 1, 2] },

      { type: 'checkbox', x: 4, y: 62, w: 63, fs: 11,
        question: '<b>Q3.</b> MintNet (slide 93) builds invertible CNNs. Select ALL true statements:',
        choices: [
          'Masked convolutions (as in PixelCNN) make the Jacobian triangular',
          'Strictly positive diagonal Jacobian entries guarantee invertibility',
          'Its inverse is computed in closed form in a single pass',
          'Masking shrinks each filter\u2019s effective receptive field'

    bubbles: [

        '$\\partial x_i/\\partial z_j=0$ for $j>i$, so the upper triangle vanishes (slide 80). This AR-style dependence is the trick behind NICE, MAF, IAF and MintNet.', 10),

        'MintNet has no closed-form inverse: it uses a parallel fixed-point iteration. Masks hide “future” pixels, as in PixelCNN.', 63)
    ]
  },

  /* ════════════════════════════════════════════════════════════
     GROUP 6 — Coupling layers: Jacobian structure (diagram)
     ════════════════════════════════════════════════════════════ */

          sel('$0$', ['$I_d$', '$0$', '$\\mathrm{diag}(e^{\\alpha_\\theta(z_{1:d})})$', '$I_{n-d}$', '$\\partial x_{d+1:n}/\\partial z_{1:d}$'], 135),
          ', block D $=$ ',
          sel('$\\mathrm{diag}(e^{\\alpha_\\theta(z_{1:d})})$', ['$I_d$', '$0$', '$\\mathrm{diag}(e^{\\alpha_\\theta(z_{1:d})})$', '$I_{n-d}$', '$\\partial x_{d+1:n}/\\partial z_{1:d}$'], 135),
          '.<br>For NICE (additive coupling), block D $=$ ',
          sel('$I_{n-d}$', ['$I_d$', '$0$', '$\\mathrm{diag}(e^{\\alpha_\\theta(z_{1:d})})$', '$I_{n-d}$', '$\\partial x_{d+1:n}/\\partial z_{1:d}$'], 135),
          ', hence $\\det J=$ ',
          sel('$1$', ['$0$', '$1$', '$\\prod_i s_i$', '$e^{\\sum_i\\alpha_i}$'], 80),

    bubbles: [
      mkBubble('<b>Q1 — A and D (the diagonal blocks).</b><br>' +
        'Block B is 0, so $J$ is block lower-triangular and $\\det J=\\det A\\cdot\\det D$. Block C (derivatives through the networks) never has to be computed.', 12),
      mkBubble('<b>Q2 — $I_d$, $0$, $\\mathrm{diag}(e^{\\alpha})$; NICE: $I_{n-d}$, det = 1.</b><br>' +

  {

    questions: [

      num(5, 18, -4.34, 0.02),
