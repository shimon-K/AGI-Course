<body>

<div id="header">Machine Learning — Energy-Based Models (EBMs) Quiz</div>

<div id="quiz-frame">

<div id="footer">Click ▶ to start · Tab between fields · Enter to submit</div>

<script>
/* ───────────────────────────────────────────────────────────────
   Quiz configuration — "Energy-Based Models" (slides 143–167):
   EBM vs GAN, normalisation, EBM form, Z-free applications,
   Product of Experts, Hopfield/BM/RBM, RBM training, contrastive
   divergence, MCMC, Langevin, score matching, NCE, FCE,
   adversarial training of EBMs.
   ─────────────────────────────────────────────────────────────── */

var VIDEO_ID = '';
var BACKGROUND = {
  enabled : true,
  color   : '#ffffff',
  autoPlay: false
};

var DEFAULT_TIME_GAP   = 4;
var POST_QUIZ_DURATION = 10;

var MOODLE = { enabled: false };

/* ───────────────────────────────────────────────────────────────
   Layout conventions
   QX / QW : left column for questions (label + widget, no gap)
   BX / BW : right column for explanation bubbles (same y-level)
   ─────────────────────────────────────────────────────────────── */
var QX = 3,  QW = 63,
    BX = 69, BW = 29;

var BUBBLE_DEFAULTS = {
  style       : 'bubble',
  tail        : 'left',
  tailSize    : 10,
  bg          : 'rgba(255,248,200,0.97)',
  borderColor : '#d4a017',
  color       : '#3a2e00',
  fs          : 10.5,
  padding     : 7,
  borderRadius: 9,
  lineSpacing : 1.4
};

function mkBubble(text, y, opts) {
  var b = { x: BX, y: y, w: BW, text: text };
  for (var k in BUBBLE_DEFAULTS) b[k] = BUBBLE_DEFAULTS[k];
  if (opts) for (var k2 in opts) b[k2] = opts[k2];
  return b;
}

function lbl(y, text, fs) {
  return { type: 'label', x: QX + 1, y: y, fs: fs || 11.5, text: text };
}

/* ───────────────────────────────────────────────────────────────
   Inline SVG diagrams (used by the hotspot questions)
   ─────────────────────────────────────────────────────────────── */
function svgURI(s) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }

/* Three graphs: A = Hopfield, B = RBM, C = full Boltzmann machine */
var BM_SVG = (function () {
  var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">' +
          '<rect width="600" height="200" fill="#ffffff"/>';
  function line(a, b) {
    s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] +
         '" stroke="#6fa8dc" stroke-width="1.5"/>';
  }
  function node(p, hid) {
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="9" fill="' + (hid ? '#f28b82' : '#d6d6d6') +
         '" stroke="' + (hid ? '#b03a2e' : '#777') + '" stroke-width="1.5"/>';
  }
  function allPairs(P) { for (var i = 0; i < P.length; i++) for (var j = i + 1; j < P.length; j++) line(P[i], P[j]); }
  function guide(cx) {
    s += '<ellipse cx="' + cx + '" cy="96" rx="96" ry="32" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>';
  }
  function letter(cx, t) {
    s += '<text x="' + cx + '" y="190" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#222">' + t + '</text>';
  }
  /* A — Hopfield: visible only, fully connected */
  var A = [];
  for (var i = 0; i < 5; i++) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / 5;
    A.push([100 + 50 * Math.cos(a), 98 + 44 * Math.sin(a)]);
  }
  allPairs(A);
  /* B — RBM: bipartite only */
  var BH = [[250, 60], [300, 60], [350, 60]], BV = [[240, 135], [280, 135], [320, 135], [360, 135]];
  BH.forEach(function (h) { BV.forEach(function (v) { line(h, v); }); });
  /* C — Boltzmann machine: all pairs */
  var CH = [[450, 60], [500, 60], [550, 60]], CV = [[440, 135], [480, 135], [520, 135], [560, 135]];
  allPairs(CH.concat(CV));
  A.forEach(function (p) { node(p, false); });
  BH.forEach(function (p) { node(p, true); });  BV.forEach(function (p) { node(p, false); });
  CH.forEach(function (p) { node(p, true); });  CV.forEach(function (p) { node(p, false); });
  guide(100); guide(300); guide(500);
  letter(100, 'A'); letter(300, 'B'); letter(500, 'C');
  s += '</svg>';
  return svgURI(s);
})();

/* Energy landscape before a CD update */
var ENERGY_SVG = (function () {
  var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230">' +
          '<rect width="600" height="230" fill="#ffffff"/>' +
          '<line x1="50" y1="212" x2="585" y2="212" stroke="#333" stroke-width="2"/>' +
          '<polygon points="585,207 595,212 585,217" fill="#333"/>' +
          '<line x1="50" y1="212" x2="50" y2="14" stroke="#333" stroke-width="2"/>' +
          '<polygon points="45,14 50,4 55,14" fill="#333"/>' +
          '<text x="60" y="20" font-family="Arial" font-size="14" fill="#333">energy  E\u03b8(x) = \u2212f\u03b8(x)</text>' +
          '<text x="575" y="228" font-family="Arial" font-size="14" fill="#333">x</text>' +
          '<path d="M60,45 C110,45 140,105 190,110 C240,115 255,80 300,85 C350,92 370,185 420,185 C470,185 520,60 575,40" ' +
          'fill="none" stroke="#1f4e79" stroke-width="3"/>' +
          /* guide ellipses (= click targets) */
          '<ellipse cx="190" cy="110" rx="30" ry="11.5" fill="none" stroke="#999" stroke-dasharray="4 3"/>' +
          '<ellipse cx="300" cy="85"  rx="30" ry="11.5" fill="none" stroke="#999" stroke-dasharray="4 3"/>' +
          '<ellipse cx="420" cy="185" rx="30" ry="11.5" fill="none" stroke="#999" stroke-dasharray="4 3"/>' +
          /* points */
          '<circle cx="190" cy="110" r="6" fill="#27ae60"/>' +
          '<circle cx="300" cy="85"  r="6" fill="#7f8c8d"/>' +
          '<circle cx="420" cy="185" r="6" fill="#c0392b"/>' +
          '<text x="105" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#1e7a45">A: x_train (data)</text>' +
          '<text x="290" y="64"  font-family="Arial" font-size="14" font-weight="bold" fill="#555">C</text>' +
          '<text x="452" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#a93226">B: x_sample \u223c p\u03b8</text>' +
          '</svg>';
  return svgURI(s);
})();

/* ───────────────────────────────────────────────────────────────
   GROUPS
   ─────────────────────────────────────────────────────────────── */
var GROUPS = [

  /* ════════════════ 1. EBM vs GAN ════════════════ */
  {
    label: 'EBMs vs. GANs — motivation', maxTries: 3,
    questions: [
      { type: 'radio', x: QX, y: 10, w: QW, fs: 12,
        question: "<b>Q1.</b> Which of the following is <u>not</u> listed as an advantage of EBMs in the EBM-vs-GAN comparison?",
        choices: [
          "Very flexible model architectures",
          "Stable training (no adversarial minimax game)",
          "The exact likelihood $p_\\theta(\\mathbf x)$ can be evaluated cheaply",
          "Flexible composition of several models"
        ],
        ans: 2 },
      { type: 'radio', x: QX, y: 42, w: QW, fs: 12,
        question: "<b>Q2.</b> Why can an EBM be trained with maximum-likelihood-style objectives, while a vanilla GAN cannot?",
        choices: [
          "An EBM specifies an explicit (un-normalised) density, so $\\log p_\\theta=f_\\theta-\\log Z(\\theta)$ is defined; a GAN only defines an implicit sampler $\\mathbf x=G_\\theta(\\mathbf z)$",
          "An EBM contains no neural network, so its likelihood is trivially available",
          "A GAN generator is always normalised, so maximising its likelihood is meaningless",
          "EBMs are trained with a discriminator and a minimax game, exactly like GANs"
        ],
        ans: 0 }
    ],
    bubbles: [
      mkBubble("<b>Q1 — cheap exact likelihood.</b><br>Evaluating $p_\\theta(\\mathbf x)$ requires $Z(\\theta)=\\int e^{f_\\theta(\\mathbf x)}d\\mathbf x$, intractable in high dimension. The slide lists for EBMs: flexible architectures, stable training, relatively high sample quality, flexible composition. For GANs: intractable likelihood, unstable training, hard evaluation, mode collapse.", 9),
      mkBubble("<b>Q2 — explicit vs. implicit model.</b><br>$\\log p_\\theta(\\mathbf x)=f_\\theta(\\mathbf x)-\\log Z(\\theta)$: the first term is known; only $∇_\\theta\\log Z$ must be approximated (MCMC / contrastive divergence) or sidestepped (score matching, NCE). A GAN generator has no density formula, so it is trained through a two-sample test (the discriminator). Having a genuine probabilistic model is also what links EBMs to score-based diffusion models.", 44)
    ]
  },

  /* ════════════════ 2. Normalisation & Z ════════════════ */
  {
    label: 'Normalisation & partition fn.', maxTries: 3,
    questions: [
      { type: 'cloze', x: QX, y: 8, w: QW, fs: 12.5, lineSpacing: 2,
        parts: [
          "<b>Q1.</b> For $g_\\lambda(x)=e^{-\\lambda x}$ on $[0,\\infty)$ with $\\lambda=4$, the volume is $Z=$ ",
          { blank: true, ans: '0.25', w: 60 },
          " (decimal), hence the normalised density is $p(x)=$ ",
          { blank: true, ans: "$4e^{-4x}$", w: 105, type: 'select',
            options: ["$\\tfrac14 e^{-4x}$", "$4e^{-4x}$", "$e^{-4x}$", "$e^{-x/4}$"] },
          "."
        ] },
      { type: 'slider', x: QX, y: 24, w: QW, fs: 12,
        question: "<b>Q2.</b> For the un-normalised Gaussian $g(x)=e^{-(x-\\mu)^2/2\\sigma^2}$ with $\\sigma^2=2$, what is the volume $Z$?",
        min: 0, max: 6, step: 0.05, ans: 3.55, tol: 0.1, unit: '' },
      { type: 'checkbox', x: QX, y: 45, w: QW, fs: 11.5,
        question: "<b>Q3.</b> Given normalised densities $p_\\theta, p_{\\theta'}$, which constructions are <u>automatically</u> normalised (no new $Z$ needed)? (select all)",
        choices: [
          "Autoregressive product $p_\\theta(\\mathbf x)\\,p_{\\theta'(\\mathbf x)}(\\mathbf y)$ over $(\\mathbf x,\\mathbf y)$",
          "Mixture $\\alpha\\,p_\\theta(\\mathbf x)+(1-\\alpha)\\,p_{\\theta'}(\\mathbf x)$ with $\\alpha\\in[0,1]$",
          "Product $p_\\theta(\\mathbf x)\\,p_{\\theta'}(\\mathbf x)$ over the same variable $\\mathbf x$",
          "Mixture $0.7\\,p_\\theta(\\mathbf x)+0.5\\,p_{\\theta'}(\\mathbf x)$",
          "$\\exp(\\mathrm{NN}_\\theta(\\mathbf x))$ for an arbitrary neural network"
        ],
        ans: [0, 1] }
    ],
    bubbles: [
      mkBubble("<b>Q1.</b> $Z=\\int_0^\\infty e^{-4x}dx=1/\\lambda=0.25$, so $p(x)=\\lambda e^{-\\lambda x}=4e^{-4x}$ (Exponential). Dividing by the volume turns any $g\\ge0$ into a valid density.", 5),
      mkBubble("<b>Q2.</b> $Z=\\sqrt{2\\pi\\sigma^2}=\\sqrt{4\\pi}\\approx3.54$. It depends on $\\sigma$ but not on $\\mu$: in general $Z=Z(\\theta)$, so its gradient matters in learning.", 26),
      mkBubble("<b>Q3 — first two.</b> AR: integrate $\\mathbf y$ first (→1), then $\\mathbf x$ (→1). Convex mixture: $\\alpha+(1-\\alpha)=1$ (GMM, VAE marginal). A product over the same $\\mathbf x$ is a Product of Experts → needs its own $Z$. Weights $0.7+0.5=1.2≠1$. A raw $\\exp(\\mathrm{NN})$ is exactly the EBM case — $Z$ unknown.", 47)
    ]
  },

  /* ════════════════ 3. The EBM form ════════════════ */
  {
    label: 'The energy-based form', maxTries: 3,
    questions: [
      { type: 'cloze', x: QX, y: 8, w: QW, fs: 12.5, lineSpacing: 2.1,
        parts: [
          "<b>Q1.</b> In $p_\\theta(\\mathbf x)=e^{f_\\theta(\\mathbf x)}/Z(\\theta)$ the energy is $E_\\theta(\\mathbf x)=$ ",
          { blank: true, ans: "$-f_\\theta(\\mathbf x)$", w: 105, type: 'select',
            options: ["$f_\\theta(\\mathbf x)$", "$-f_\\theta(\\mathbf x)$", "$\\log Z(\\theta)$", "$e^{f_\\theta(\\mathbf x)}$"] },
          ".<br>If $f_\\theta(\\mathbf x_1)=3$ and $f_\\theta(\\mathbf x_2)=1$, then $p_\\theta(\\mathbf x_1)/p_\\theta(\\mathbf x_2)=$ ",
          { blank: true, ans: "$e^{2}\\approx7.39$", w: 125, type: 'select',
            options: ["$3$", "$e^{2}\\approx7.39$", "$e^{-2}\\approx0.14$", "unknown without $Z$"] },
          ".<br>Adding a constant $c$ to $f_\\theta$ everywhere makes this ratio ",
          { blank: true, ans: 'unchanged', w: 110, type: 'select', options: ['larger', 'smaller', 'unchanged'] },
          "."
        ] },
      { type: 'radio', x: QX, y: 35, w: QW, fs: 12,
        question: "<b>Q2.</b> Why does the EBM use $\\exp(f_\\theta(\\mathbf x))$, rather than e.g. $f_\\theta(\\mathbf x)^2$, to obtain a non-negative function?",
        choices: [
          "Because the exponential automatically makes $\\int e^{f_\\theta}d\\mathbf x=1$",
          "Because then $\\log p_\\theta=f_\\theta-\\log Z$: modest changes of $f_\\theta$ give multiplicative (orders-of-magnitude) changes of probability, and many exponential-family / physical laws have this form",
          "Because $f_\\theta^2$ cannot be differentiated by back-propagation",
          "Because the exponential removes the need for a partition function"
        ],
        ans: 1 }
    ],
    bubbles: [
      mkBubble("<b>Q1.</b> $f_\\theta=-E_\\theta$: low energy ⇔ high probability (physics convention, hence the minus sign). Ratio: $e^{f(\\mathbf x_1)-f(\\mathbf x_2)}=e^{2}$ — $Z$ cancels. Adding $c$ multiplies the numerator <i>and</i> $Z$ by $e^{c}$, so the distribution is unchanged: $f_\\theta$ is defined only up to an additive constant.", 6),
      mkBubble("<b>Q2.</b> Log-probability is the natural scale: a difference of 10 in $f_\\theta$ is a factor $e^{10}\\approx22{,}000$ in probability, so a smooth network can express huge variations; with $f^2$ it would have to be highly non-smooth. The form matches exponential families and the Boltzmann law $p\\propto e^{-E/kT}$. It does <u>not</u> normalise anything — $Z$ is still needed. Softmax is the same idea over a finite set of classes, where $Z$ is a short sum.", 38)
    ]
  },

  /* ════════════════ 4. Tasks without Z ════════════════ */
  {
    label: 'Tasks that do not need Z', maxTries: 3,
    questions: [
      lbl(8, "<b>Q1.</b> Does each task need the partition function $Z(\\theta)$ (or its gradient)?"),
      { type: 'match', x: QX + 1, y: 12, w: 520, fs: 10.5,
        dotSize: 12, dotGap: 6, colGap: 50,
        left: [
          "Exact value $p_\\theta(\\mathbf x)$",
          "Is $\\mathbf x$ likelier than $\\mathbf x'$?",
          "Denoise: $\\arg\\max_{\\mathbf y}p(\\mathbf y|\\mathbf x)$",
          "Exact MLE grad. $∇_\\theta\\log p_\\theta$",
          "Classify: $\\arg\\min_y E(\\mathbf x,y)$"
        ],
        right: ['<b>Needs Z</b>', '<b>Z-free</b>'],
        ans: [0, 1, 1, 0, 1] },
      { type: 'radio', x: QX, y: 47, w: QW, fs: 11.5,
        question: "<b>Q2.</b> Ising denoising (slide 147): a new corrupted $5\\times5$ binary image $\\mathbf x$ arrives. How is the clean image $\\mathbf y$ recovered?",
        choices: [
          "Compute $Z$ over all $2^{50}$ joint configurations, then evaluate $p(\\mathbf y|\\mathbf x)$",
          "Maximise $\\sum_i\\psi_i(x_i,y_i)+\\sum_{(i,j)\\in E}\\psi_{ij}(y_i,y_j)$ over $\\mathbf y$ — neither $Z$ nor $p(\\mathbf x)$ is needed",
          "Output $\\mathbf y=\\mathbf x$, since $\\psi_i$ already ties every pixel to its observation",
          "Maximise only the pairwise prior $\\sum\\psi_{ij}(y_i,y_j)$"
        ],
        ans: 1 }
    ],
    bubbles: [
      mkBubble("<b>Q1.</b> Comparisons are Z-free: $\\frac{p(\\mathbf x)}{p(\\mathbf x')}=e^{f(\\mathbf x)-f(\\mathbf x')}$. Denoising and classification are argmax/argmin over candidates that all share the same $Z$ (slide 147: object recognition, sequence labelling, image restoration; also anomaly detection). An exact probability value, or the exact MLE gradient $∇ f-∇\\log Z$, does need $Z$.", 7),
      mkBubble("<b>Q2.</b> $p(\\mathbf y|\\mathbf x)=p(\\mathbf y,\\mathbf x)/p(\\mathbf x)$, and both $p(\\mathbf x)$ and $1/Z$ are constants in $\\mathbf y$ ⇒ MAP = maximise the exponent. $\\psi_i$ keeps $y_i$ close to $x_i$ (likelihood); $\\psi_{ij}$ makes neighbours agree (smoothness prior). Copying $\\mathbf x$ ignores the prior; the prior alone gives a constant image. ($25+25=50$ binary variables ⇒ $2^{50}$ joint states.)", 47)
    ]
  },

  /* ════════════════ 5. Product of Experts ════════════════ */
  {
    label: 'Product of Experts vs. mixtures', maxTries: 3,
    questions: [
      { type: 'cloze', x: QX, y: 8, w: QW, fs: 12.5, lineSpacing: 2.1,
        parts: [
          "<b>Q1.</b> At an input $\\mathbf x$ three normalised experts give $q=0.5,\\ r=0,\\ t=0.9$.<br>The un-normalised product $q\\,r\\,t=$ ",
          { blank: true, ans: '0', w: 45 },
          " while an equal-weight mixture gives ",
          { blank: true, ans: "$\\approx0.47$", w: 90, type: 'select',
            options: ["$0$", "$\\approx0.47$", "$1.4$", "$0.225$"] },
          ".<br>Hence a product behaves like logical ",
          { blank: true, ans: 'AND', w: 70, type: 'select', options: ['AND', 'OR', 'XOR'] },
          " and a mixture like logical ",
          { blank: true, ans: 'OR', w: 70, type: 'select', options: ['AND', 'OR', 'XOR'] },
          "."
        ] },
      { type: 'radio', x: QX, y: 36, w: QW, fs: 12,
        question: "<b>Q2.</b> Two experts are both the standard normal $\\mathcal N(0,1)$. What is $\\int q(x)\\,r(x)\\,dx$ — the factor that $Z(\\theta_1,\\theta_2)$ must correct?",
        choices: [
          "$1$ — a product of densities is a density",
          "$\\frac{1}{2\\sqrt{\\pi}}\\approx0.28$",
          "$\\frac{1}{\\sqrt{2\\pi}}\\approx0.40$",
          "$2$"
        ],
        ans: 1 }
    ],
    bubbles: [
      mkBubble("<b>Q1.</b> $0.5\\cdot0\\cdot0.9=0$: one veto kills $\\mathbf x$ — an intersection of constraints (AND), e.g. <i>Young AND Female AND Smiling</i> faces (Du et al. 2020). Mixture: $(0.5+0+0.9)/3\\approx0.47$ — one believer suffices (OR). In energy terms a PoE simply adds energies: $E=E_1+E_2+E_3$.", 6),
      mkBubble("<b>Q2.</b> $q\\,r=\\frac{1}{2\\pi}e^{-x^2}$ and $\\int e^{-x^2}dx=\\sqrt\\pi$ ⇒ $\\frac{\\sqrt\\pi}{2\\pi}=\\frac{1}{2\\sqrt\\pi}\\approx0.28≠1$. After renormalising, the product is $\\mathcal N(0,\\tfrac12)$ — sharper than either expert: agreeing experts make the model more confident. For neural experts there is no closed form, so $Z(\\theta_1,\\theta_2,\\theta_3)$ is handled as in any EBM.", 39)
    ]
  },

  /* ════════════════ 6. Hopfield / BM / RBM ════════════════ */
  {
    label: 'Hopfield, BM & RBM', maxTries: 3,
    questions: [
      { type: 'hotspot', x: QX, y: 8, w: 50, fs: 11.5,
        question: "<b>Q1.</b> Click the graph whose energy is $E(\\mathbf v,\\mathbf h)=-(\\mathbf v^\\top W\\mathbf h+\\mathbf a^\\top\\mathbf v+\\mathbf b^\\top\\mathbf h)$ (red = hidden, grey = visible).",
        src: BM_SVG,
        spots: [ { x: 16.67, y: 48, r: 16, label: 'A' },
                 { x: 50,    y: 48, r: 16, label: 'B' },
                 { x: 83.33, y: 48, r: 16, label: 'C' } ],
        ans: 1 },
      { type: 'radio', x: QX, y: 49, w: QW, fs: 11,
        question: "<b>Q2.</b> What does the \"restriction\" in an RBM buy us computationally?",
        choices: [
          "Given $\\mathbf x$, the hidden units are conditionally independent: $p(\\mathbf z|\\mathbf x)=\\prod_j p(z_j|\\mathbf x)$, enabling cheap block-Gibbs sampling",
          "It makes $Z(W,\\mathbf b,\\mathbf c)$ available in closed form",
          "It removes the need for hidden units altogether"
        ],
        ans: 0 },
      { type: 'cloze', x: QX, y: 75, w: QW, fs: 12.5, lineSpacing: 2,
        parts: [
          "<b>Q3.</b> An RBM with $n=10$ visible and $m=20$ hidden binary units: $Z$ is a sum over ",
          { blank: true, ans: "$2^{30}$", w: 80, type: 'select',
            options: ["$200$", "$30^2$", "$2^{30}$", "$2^{200}$"] },
          " configurations."
        ] }
    ],
    bubbles: [
      mkBubble("<b>Q1 — graph B.</b> The energy has only cross terms $v_iW_{ij}h_j$ (+ biases) ⇒ edges only <i>between</i> the layers. A has no hidden units: Hopfield, $E(\\mathbf x)=-\\tfrac12\\mathbf x^\\top W\\mathbf x-\\mathbf b^\\top\\mathbf x$. C connects every pair (v–v and h–h too): the general Boltzmann machine.", 8),
      mkBubble("<b>Q2.</b> With no $z_iz_j$ terms the exponent splits into a sum of terms each involving one $z_j$, so $p(z_j{=}1|\\mathbf x)=\\sigma(c_j+\\mathbf x^\\top W_{:,j})$ independently (and symmetrically for $\\mathbf x|\\mathbf z$). $Z$ remains intractable.", 47),
      mkBubble("<b>Q3.</b> $2^{10}\\cdot2^{20}=2^{30}\\approx10^9$ terms — exponential in $n+m$ (200 is just the number of weights).", 69)
    ]
  },

  /* ════════════════ 7. RBM training ════════════════ */
  {
    label: 'RBM training: two phases', maxTries: 3,
    questions: [
      { type: 'cloze', x: QX, y: 8, w: QW, fs: 12.5, lineSpacing: 2.3,
        parts: [
          "<b>Q1.</b> For a binary RBM, $\\frac{\\partial\\ell}{\\partial W_{dk}}=\\frac1N\\sum_n\\big($ ",
          { blank: true, ans: "$\\mathbb E[x_dz_k\\,|\\,\\mathbf x_n]$", w: 115, type: 'select',
            options: ["$\\mathbb E[x_dz_k]$", "$\\mathbb E[x_dz_k\\,|\\,\\mathbf x_n]$"] },
          " $-$ ",
